name: sukey_pastillas
description: "Recordatorio de pastillas y agenda médica para la familia."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Notificaciones locales programadas (con botón "Ya me la tomé").
  # El rango deja que pub elija la versión más nueva compatible con tu Flutter.
  flutter_local_notifications: '>=20.0.0 <23.0.0'
  # Zona horaria del teléfono, para que los avisos lleguen a la hora correcta.
  flutter_timezone: ^5.1.0
  timezone: '>=0.10.0 <0.12.0'
  # Guarda la lista de pastillas y el registro de tomas en el teléfono.
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
